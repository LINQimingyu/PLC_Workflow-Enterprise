<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentsPLC 平台说明</title><style>:root{--reading-scale:1;color-scheme:light;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:calc(18px * var(--reading-scale));line-height:1.65;color:#19324b;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0}a{color:#235cbb;text-underline-offset:4px}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer;min-height:44px;padding:.4rem .75rem;border:1px solid #bfd0e2;border-radius:8px;background:white;color:#23486d}button:hover{background:#edf4ff}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #3976df;outline-offset:3px}button[aria-selected=true]{background:#245bc3;border-color:#245bc3;color:white}
.guide-header{background:#10253f;color:white;padding:1.2rem max(1.2rem,calc((100vw - 1280px)/2));display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}.guide-header h1{font-size:1.5rem;line-height:1.35;margin:0}.guide-header p{font-size:.9rem;color:#d3e0ef;margin:.3rem 0 0}.reading-controls{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;font-size:.9rem}.reading-controls output{font-variant-numeric:tabular-nums;min-width:3.4em;text-align:center}.guide-header .reading-controls button{border-color:#5d7695;background:#1b385a;color:white}
.guide-bar{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap;max-width:1320px;margin:auto;padding:1rem 1.2rem;background:white;border-bottom:1px solid #dbe5ef}.guide-links{display:flex;gap:.9rem;flex-wrap:wrap;align-items:center;margin-left:auto;font-size:.9rem}.guide-links a{min-height:44px;display:inline-flex;align-items:center}.guide-note{max-width:1320px;margin:auto;padding:.8rem 1.2rem;color:#4c637a;font-size:.9rem}.guide-frame{display:block;width:100%;height:1000px;border:0;background:#f3f6fa}.embedded .guide-header,.embedded .standalone-actions{display:none}
.guide-content{max-width:1280px;margin:0 auto;padding:1.2rem}.guide-title{margin:0 0 .35rem;font-size:1.65rem;line-height:1.4}.intro{margin:0 0 1.2rem;color:#4c637a}.section-title{font-size:1.25rem;margin:1.7rem 0 .8rem}.layer{border:1px solid #cbd9e8;border-radius:14px;background:white;box-shadow:0 4px 12px #19324b05;padding:1rem 1.1rem}.layer-head{display:flex;align-items:center;gap:.65rem;margin:0 0 .85rem;font-size:1.1rem}.layer-head span,.step-number{font-size:.9rem;font-weight:700;color:#245bc3;background:#eaf1fd;border-radius:8px;min-width:2.2rem;text-align:center;padding:.25rem .4rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:.9rem}.cards.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr))}.unit{background:#f6f9fd;border:1px solid #dce5ef;border-radius:10px;padding:.9rem;min-width:0}.unit h3{font-size:1.05rem;line-height:1.5;margin:0 0 .35rem}.unit p{margin:.35rem 0;font-size:.94rem}.unit .relation{color:#24579a;font-weight:600;font-size:.87rem}.connector{min-height:3.2rem;display:flex;align-items:center;justify-content:center;gap:.8rem;font-size:.9rem;color:#345c81;padding:.4rem}.connector .arrow{font-size:1.4rem;line-height:1;color:#2e7191}.authority{border-left:5px solid #d45670}.runtime{border-left:5px solid #239b82}.support{border-left:5px solid #6b63b6}.muted{color:#526a80}.module-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:.75rem}.module-list article{border:1px solid #dbe4ee;background:white;border-radius:10px;padding:.9rem}.module-list h3{font-size:1rem;margin:0 0 .3rem}.module-list p{font-size:.9rem;margin:0;color:#526a80}.notice{border-left:4px solid #bd8419;background:#fff8e9;border-radius:0 8px 8px 0;padding:.85rem 1rem;margin:1.2rem 0;font-size:.95rem}.notice strong{display:block}.standalone-actions{max-width:1280px;margin:auto;padding:0 1.2rem 1.2rem}
.workflow{list-style:none;padding:0;margin:1.2rem 0}.step{position:relative;display:grid;grid-template-columns:2.5rem minmax(0,1fr);gap:.8rem;padding:1rem;border:1px solid #cbd9e8;border-radius:12px;background:white;margin-bottom:2.4rem}.step:not(:last-child)::after{content:'↓';position:absolute;bottom:-2.1rem;left:1.65rem;height:1.7rem;color:#3d799c;font-size:1.4rem}.step-number{align-self:start}.step h2{margin:0 0 .3rem;font-size:1.15rem}.step p{margin:.4rem 0;font-size:.95rem}.step-meta{display:flex;flex-wrap:wrap;gap:.45rem .9rem;font-size:.85rem;color:#526a80;margin-bottom:.5rem}.gate{font-weight:600;color:#285ca0;background:#eef4ff;padding:0 .4rem;border-radius:4px}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:.6rem;margin:.8rem 0}.check{border:1px solid #d7e2ed;border-radius:8px;padding:.7rem;background:#f7fafc;font-size:.9rem}.check strong{display:block;margin-bottom:.2rem}.repair{margin:.9rem 0 0;padding:.8rem 1rem;border:1px solid #e6c7cd;border-radius:8px;background:#fff6f7;font-size:.9rem}.repair h3{font-size:1rem;margin:0 0 .45rem}.repair ol{margin:.4rem 0;padding-left:1.4rem}.repair li{padding:.2rem 0}.repair p{font-size:.9rem}.independent{border:1px dashed #9b8bbd;background:#faf7ff}
.article-layout{max-width:1320px;margin:1.2rem auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:1.2rem;padding:0 1.2rem}.article-layout nav{position:sticky;top:1rem;align-self:start;background:white;border:1px solid #dbe4ee;padding:.8rem;border-radius:10px;font-size:.85rem}.article-layout nav a{display:block;padding:.4rem 0}.article-layout main{min-width:0;background:white;border:1px solid #dbe4ee;border-radius:12px;padding:1.5rem}.article-layout h1{font-size:1.5rem}.article-layout h2{font-size:1.2rem;border-top:1px solid #dbe4ee;padding-top:1rem;margin-top:1.5rem}.article-layout p,.article-layout li{font-size:1rem}.table-wrap{overflow:auto}table{border-collapse:collapse;font-size:.9rem;min-width:38rem;width:100%;text-align:left}th,td{padding:.65rem;border:1px solid #dbe4ee;vertical-align:top}th{background:#edf3fa}code{font-size:.9em;overflow-wrap:anywhere}.guide-footer{max-width:1280px;margin:0 auto;padding:1rem 1.2rem 2rem;color:#526a80;font-size:.85rem}
@media(max-width:800px){.article-layout{display:block}.article-layout nav{position:static;margin-bottom:1rem}.article-layout main{padding:1rem}.guide-links{margin-left:0;width:100%}.guide-content{padding:1rem}.guide-title{font-size:1.4rem}.step{grid-template-columns:2.2rem minmax(0,1fr);padding:.8rem;gap:.5rem}.layer{padding:.8rem}.guide-header{padding:1rem}.cards,.cards.three{grid-template-columns:1fr}}
@media print{.reading-controls,.guide-bar,.standalone-actions{display:none}.guide-content{max-width:none;padding:0}.layer,.step,.unit{break-inside:avoid;box-shadow:none}.guide-header{background:white;color:black}.guide-header p{color:#333}.guide-footer{color:#333}.article-layout{display:block}.article-layout nav{display:none}.article-layout main{border:0}.table-wrap{overflow:visible}table{min-width:0}}
</style></head><body><header class="guide-header"><div><h1>AgentsPLC 平台说明</h1><p>整体架构与工程交付</p></div><div class="reading-controls" role="group" aria-label="字体大小"><span>字体</span><button type="button" data-font-action="decrease" aria-label="缩小字体">A−</button><output data-font-output aria-label="字体比例" aria-live="polite">100%</output><button type="button" data-font-action="increase" aria-label="放大字体">A＋</button><button type="button" data-font-action="reset" aria-label="恢复默认字体">默认</button></div></header><div class="guide-bar"><div role="tablist" aria-label="说明内容"><button role="tab" id="architecture-tab" data-id="architecture" aria-selected="true" aria-controls="document">整体架构总览</button> <button role="tab" id="workflow-tab" data-id="workflow" aria-selected="false" aria-controls="document" tabindex="-1">工程交付工作流</button></div><div class="guide-links"><a id="workbench" href="/" target="_blank" rel="noopener">打开项目工作台</a><a id="read" target="_blank" rel="noopener">阅读详细说明</a><a id="open" target="_blank" rel="noopener">独立打开／打印</a></div></div><p class="guide-note" id="note"></p><iframe class="guide-frame" id="document" title="整体架构总览" sandbox="allow-scripts" referrerpolicy="no-referrer" role="tabpanel" aria-labelledby="architecture-tab"></iframe><script>(()=>{'use strict';
 const key='agentsplc.reading-percent.v1';
 const clamp=v=>Number.isFinite(v)?Math.min(160,Math.max(90,Math.round(v/10)*10)):100;
 let percent=100;
 try{percent=clamp(Number(localStorage.getItem(key)||100));}catch{}
 const embedded=parent!==window;
 document.documentElement.classList.toggle('embedded',embedded);
 function reportHeight(){if(embedded)parent.postMessage({type:'agentsplc-guide-height',height:Math.ceil(document.body.getBoundingClientRect().height)},'*');}
 function apply(next,persist=true){percent=clamp(next);document.documentElement.style.setProperty('--reading-scale',String(percent/100));
  document.querySelectorAll('[data-font-output]').forEach(e=>e.textContent=percent+'%');
  document.querySelectorAll('[data-font-action=decrease]').forEach(e=>e.disabled=percent===90);
  document.querySelectorAll('[data-font-action=increase]').forEach(e=>e.disabled=percent===160);
  if(persist&&!embedded)try{localStorage.setItem(key,String(percent));}catch{}
  document.querySelectorAll('iframe.guide-frame').forEach(f=>f.contentWindow?.postMessage({type:'agentsplc-reading-size',percent},'*'));
  requestAnimationFrame(reportHeight);
 }
 document.querySelectorAll('[data-font-action]').forEach(button=>button.addEventListener('click',()=>apply(button.dataset.fontAction==='reset'?100:percent+(button.dataset.fontAction==='increase'?10:-10))));
 window.addEventListener('storage',e=>{if(e.key===key)apply(Number(e.newValue||100),false);});
 window.addEventListener('message',e=>{
  if(embedded&&e.source===parent&&e.data?.type==='agentsplc-reading-size'&&typeof e.data.percent==='number')apply(e.data.percent,false);
  const frame=document.querySelector('iframe.guide-frame');
  if(frame&&e.source===frame.contentWindow&&e.data?.type==='agentsplc-guide-height'&&Number.isFinite(e.data.height)&&e.data.height>0)frame.style.height=Math.min(100000,Math.ceil(e.data.height)+4)+'px';
 });
 document.querySelectorAll('iframe.guide-frame').forEach(frame=>frame.addEventListener('load',()=>apply(percent,false)));
 if(embedded){new ResizeObserver(reportHeight).observe(document.body);window.addEventListener('load',reportHeight);}
 window.agentsPLCReading={apply,get percent(){return percent;}};
 apply(percent,false);
})();
</script><script>(()=>{const local=location.protocol==='file:';
const routes=local?{architecture:'architecture.html',workflow:'workflow.html'}:{architecture:'/api/guides/architecture',workflow:'/api/guides/workflow'};
const notes=local?{architecture:'architecture-note.html',workflow:'workflow-note.html'}:{architecture:'/api/guides/architecture-note',workflow:'/api/guides/workflow-note'};
const copy={architecture:'按层阅读职责与执行关系，字体可调；说明中的项目示例已移至项目工作台。',workflow:'主线按编号顺序执行；缺项与修复条件就近说明，字体设置在切换后保留。'};
function show(id){document.querySelectorAll('[data-id]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.id===id));b.tabIndex=b.dataset.id===id?0:-1;});const f=document.getElementById('document');f.src=routes[id];f.title=document.querySelector('[data-id="'+id+'"]').textContent;f.setAttribute('aria-labelledby',id+'-tab');document.getElementById('note').textContent=copy[id];document.getElementById('read').href=notes[id];document.getElementById('open').href=routes[id];}
document.querySelectorAll('[data-id]').forEach(b=>{b.addEventListener('click',()=>show(b.dataset.id));b.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const id=e.key==='Home'?'architecture':e.key==='End'?'workflow':b.dataset.id==='architecture'?'workflow':'architecture';show(id);document.querySelector('[data-id="'+id+'"]').focus();});});
if(local)document.getElementById('workbench').href='http://127.0.0.1:8774/';show('architecture');})();</script></body></html>
