services:
  db:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: plc_enterprise
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password, app_password]
    volumes:
      - enterprise_pg:/var/lib/postgresql
      - ./deploy/init_db.sh:/docker-entrypoint-initdb.d/10-enterprise.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d plc_enterprise"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  workbench:
    build: .
    ports: ["127.0.0.1:8774:8774"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      EP_MODEL_KEY_FILE: /run/secrets/model_key
      EP_MODEL_KEY_BASE_URL: ${EP_MODEL_KEY_BASE_URL:-}
    secrets: [app_password, model_key]
    volumes: ["enterprise_data:/data"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
secrets:
  postgres_password: {file: .deployment/postgres-password}
  app_password: {file: .deployment/app-password}
  model_key: {file: .deployment/model-key}
volumes:
  enterprise_pg:
  enterprise_data:
